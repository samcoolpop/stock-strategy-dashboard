name: Sync stock strategy data

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Task to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - monitor
          - close-scan
  schedule:
    # Beijing 14:10/14:15/14:20. Redundant monitor runs before late-session trading.
    - cron: "10 6 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "20 6 * * 1-5"
    # Beijing 15:40. Add newly confirmed momentum candidates after close.
    - cron: "40 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-strategy-data
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    env:
      APP_DATA_SOURCE: akshare
      APP_DB_PATH: stock_strategy.sqlite3
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: python -m src.jobs init-db

      - name: Run scheduled task
        shell: bash
        run: |
          set +e
          INPUT_JOB="${{ github.event.inputs.job }}"
          EVENT_SCHEDULE="${{ github.event.schedule }}"
          if [ -z "$INPUT_JOB" ]; then
            if [ "$EVENT_SCHEDULE" = "10 6 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "15 6 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "20 6 * * 1-5" ]; then
              INPUT_JOB="monitor"
            elif [ "$EVENT_SCHEDULE" = "40 7 * * 1-5" ]; then
              INPUT_JOB="close-scan"
            else
              INPUT_JOB="both"
            fi
          fi

          FAILED=0
          if [ "$INPUT_JOB" = "monitor" ] || [ "$INPUT_JOB" = "both" ]; then
            python -m src.jobs monitor
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "monitor failed with status $STATUS"
              FAILED=1
            fi
          fi
          if [ "$INPUT_JOB" = "close-scan" ] || [ "$INPUT_JOB" = "both" ]; then
            python -m src.jobs close-scan
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "close-scan failed with status $STATUS"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "TASK_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: Commit updated database
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stock_strategy.sqlite3
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update stock strategy data"
            git pull --rebase origin main
            git push
          fi

      - name: Fail if any task failed
        if: env.TASK_FAILED == '1'
        shell: bash
        run: |
          echo "At least one data task failed. Database/log changes were still committed when possible."
          exit 1
